name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Check inventory and its navigation-free installable JAR
        run: ./gradlew :core:check :storage-sqlite:check :neoforge-1.21.1:check --no-daemon

      - name: Check optional navigation and its standalone installable JAR
        run: ./gradlew :navigation-core:check :navigation-neoforge-1.21.1:check --no-daemon
